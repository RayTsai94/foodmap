{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block extra_js %}
<script>
// 追蹤打卡事件
function trackCheckin(restaurantId, restaurantName) {
    gtag('event', 'checkin', {
        'restaurant_id': restaurantId,
        'restaurant_name': restaurantName,
        'timestamp': new Date().toISOString()
    });
}

// 追蹤上傳照片事件
function trackPhotoUpload(restaurantId, restaurantName) {
    gtag('event', 'upload_checkin_photo', {
        'restaurant_id': restaurantId,
        'restaurant_name': restaurantName
    });
}

// 追蹤添加評論事件
function trackAddComment(restaurantId, restaurantName) {
    gtag('event', 'add_checkin_comment', {
        'restaurant_id': restaurantId,
        'restaurant_name': restaurantName
    });
}
</script>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>新增打卡</h2>
    <form method="post" enctype="multipart/form-data" id="checkinForm" 
          onsubmit="trackCheckin('{{ restaurant.id }}', '{{ restaurant.name }}')">
        {% csrf_token %}
        {{ form|crispy }}
        
        <!-- 修改照片上傳input -->
        <div class="mb-3">
            <label for="id_photo" class="form-label">上傳照片</label>
            <input type="file" class="form-control" id="id_photo" name="photo" 
                   onchange="trackPhotoUpload('{{ restaurant.id }}', '{{ restaurant.name }}')">
        </div>

        <!-- 修改評論textarea -->
        <div class="mb-3">
            <label for="id_comment" class="form-label">評論</label>
            <textarea class="form-control" id="id_comment" name="comment" rows="3"
                      onblur="if(this.value) trackAddComment('{{ restaurant.id }}', '{{ restaurant.name }}')"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">提交打卡</button>
    </form>
</div>
{% endblock %}
