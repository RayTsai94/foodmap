{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <h1>{% if form.instance.pk %}編輯打卡{% else %}新增打卡{% endif %}</h1>
    <form method="post" enctype="multipart/form-data" onsubmit="trackCheckinSubmit(event)">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">送出</button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
function trackCheckinSubmit(event) {
    // 防止表單立即提交
    event.preventDefault();
    
    // 獲取表單數據
    const form = event.target;
    const restaurantName = form.querySelector('#id_restaurant_name').value;
    const item = form.querySelector('#id_item').value;
    const price = form.querySelector('#id_price').value;
    
    // 追蹤打卡事件
    Analytics.trackCheckin(restaurantName, item, price);
    
    // 提交表單
    form.submit();
}
</script>
{% endblock %}
